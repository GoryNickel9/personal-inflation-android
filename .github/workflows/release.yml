name: Signed Android release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: android-release
  queue: max
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate release ancestry
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Choose next release version
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty')
          args=()
          if [[ -n "$latest" ]]; then
            gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern update.json --dir "$RUNNER_TEMP/previous"
            args=(--previous "$RUNNER_TEMP/previous/update.json")
          fi
          python3 scripts/next_release.py "${args[@]}" --output "$RUNNER_TEMP/release-version.properties" --github-env "$GITHUB_ENV"
      - name: Test and sign release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/prezzi-release.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          bash ./gradlew testDebugUnitTest lintRelease assembleRelease "-PversionCode=$RELEASE_VERSION_CODE" "-PversionName=$RELEASE_VERSION_NAME" --no-daemon --max-workers=2
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Prepare update manifest and checksums
        run: |
          set -euo pipefail
          args=()
          if [[ -f "$RUNNER_TEMP/previous/update.json" ]]; then
            args=(--previous "$RUNNER_TEMP/previous/update.json")
          fi
          python3 scripts/release_artifacts.py --version-file "$RUNNER_TEMP/release-version.properties" --tag "$RELEASE_TAG" "${args[@]}"
      - name: Publish complete release
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Prezzi per Android. Aggiornamento della pagina trascinando verso il basso, controllo automatico delle release e installazione verificata tramite Android.

          Installa l'APK allegato. Per passare dal vecchio APK debug alla release serve una prima reinstallazione: i prezzi restano nel database del sito. Non disinstallare le successive versioni release; usa l'aggiornamento dall'app.
          NOTES
          printf '\nCommit: %s\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" artifacts/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Prezzi $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
